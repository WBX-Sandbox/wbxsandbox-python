[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wbxsandbox"
version = "0.15.3"
description = "Python SDK for WBX Sandbox – isolated cloud sandboxes (Firecracker microVMs) for AI agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "MIT"
authors = [{ name = "KXCOMM s.r.o." }]
keywords = ["sandbox", "firecracker", "microvm", "ai agents", "code execution", "wbx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://sandbox.wbx.cz"
Documentation = "https://sandbox.wbx.cz/docs"
Pricing = "https://sandbox.wbx.cz/pricing"

[project.scripts]
wbx = "wbxsandbox.cli:main"

[tool.setuptools]
packages = ["wbxsandbox"]
